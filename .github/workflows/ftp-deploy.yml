name: Deploy via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy Website via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Prepare clean distribution
        run: |
          mkdir -p dist
          cp index.html style.css game.js sprites.js levels.js audio.js bark_data.js dog_bark.ogg emma.jpg banner.jpg README.md start_game.bat dist/

      - name: 📂 Deploy files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR || './' }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=20 -o StrictHostKeyChecking=no'
